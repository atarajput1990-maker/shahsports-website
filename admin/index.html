<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shah Sports Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
:root{
  --black:#0A0A0A; --gold:#C8A84A; --blue:#2962FF; --green:#16A34A; --red:#DC2626;
  --side:#F4F4F5; --border:#E4E4E7; --mid:#71717A; --dark:#18181B; --off:#FAFAFA;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#fff;color:var(--dark);font-size:14px;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:14px}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit}

/* ── LOGIN SCREEN ── */
#login-screen{
  position:fixed;inset:0;background:#fff;z-index:200;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.login-box{text-align:center;max-width:380px;width:100%}
.login-logo{font-size:26px;font-weight:800;letter-spacing:6px;margin-bottom:6px}
.login-logo .g{color:var(--gold)}
.login-sub{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--mid);margin-bottom:36px}
.login-btn{
  background:var(--black);color:#fff;padding:14px 28px;width:100%;
  font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  transition:opacity .2s;
}
.login-btn:hover{opacity:.85}
.login-note{margin-top:22px;font-size:12px;color:var(--mid);line-height:1.7}
.login-note a{color:var(--blue);text-decoration:none}

/* ── HEADER ── */
header{
  background:var(--black);height:52px;display:flex;align-items:center;
  justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:60;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{font-size:13px;font-weight:700;letter-spacing:3px;white-space:nowrap}
.brand .logo .w{color:#fff}
.brand .logo .g{color:var(--gold)}
.brand .div{color:#52525B;font-size:13px}
.brand .adm{color:#A1A1AA;font-size:13px;letter-spacing:.5px}
.huser{display:flex;align-items:center;gap:10px}
.huser .nm{color:#E4E4E7;font-size:13px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{
  width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--black);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:0 0 auto;
}
.logout{
  color:#A1A1AA;border:1px solid #3F3F46;padding:6px 12px;font-size:11px;
  letter-spacing:1px;text-transform:uppercase;transition:all .2s;
}
.logout:hover{color:#fff;border-color:#71717A}

/* ── LAYOUT ── */
.shell{display:flex;min-height:calc(100vh - 52px)}
nav.side{
  width:180px;flex:0 0 180px;background:var(--side);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:14px 0;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 16px;width:100%;
  font-size:13px;color:#3F3F46;text-align:left;transition:background .15s;position:relative;
}
.nav-item:hover{background:#E9E9EC}
.nav-item.active{background:var(--blue);color:#fff;font-weight:600}
.nav-item i{font-size:17px}
.nav-badge{
  margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;padding:0 5px;
  display:flex;align-items:center;justify-content:center;
}
.nav-item.active .nav-badge{background:#fff;color:var(--red)}
.live-box{
  margin:auto 12px 4px;background:#F0FDF4;border:1px solid #BBF7D0;padding:12px;
}
.live-box .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
.live-box .t{font-size:11px;font-weight:700;color:#15803D;letter-spacing:.3px}
.live-box a{
  display:block;margin-top:6px;font-size:11px;color:#166534;text-decoration:none;
  word-break:break-all;
}
.live-box a:hover{text-decoration:underline}

main{flex:1;padding:28px 32px;min-width:0;background:#fff}

/* ── PAGE HEAD ── */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:23px;font-weight:800;letter-spacing:-.3px}
.sub{font-size:12px;color:var(--mid);margin-top:5px}
.btn-gold{
  background:var(--gold);color:var(--black);padding:11px 18px;font-size:12px;
  font-weight:700;letter-spacing:1px;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:7px;transition:filter .2s;white-space:nowrap;
}
.btn-gold:hover{filter:brightness(1.07)}
.btn-gold:disabled{opacity:.5;cursor:not-allowed}

/* ── PILLS ── */
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.pill{
  padding:7px 14px;border:1px solid var(--border);background:#fff;border-radius:99px;
  font-size:12px;color:#52525B;transition:all .15s;
}
.pill:hover{border-color:#A1A1AA}
.pill.active{background:var(--black);color:#fff;border-color:var(--black)}

/* ── TABLE ── */
.tbl-wrap{border:1px solid var(--border);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{
  background:var(--off);text-align:left;padding:10px 14px;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--mid);font-weight:700;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
td{padding:10px 14px;border-bottom:1px solid #F4F4F5;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--off)}
.thumb{
  width:44px;height:44px;background:var(--off);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;
}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.thumb span{font-size:19px;opacity:.45}
.p-name{font-weight:600}
.p-badge{
  display:inline-block;margin-left:7px;background:var(--black);color:#fff;
  font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;vertical-align:middle;
}
.p-cat{font-size:12px;color:var(--mid)}
.p-price{font-weight:700;white-space:nowrap}
.photo-ok{color:var(--green);display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.photo-no{color:var(--red);display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.act{
  border:1px solid var(--border);padding:6px 11px;font-size:11px;letter-spacing:.5px;
  display:inline-flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap;
}
.act:hover{border-color:#A1A1AA;background:#fff}
.act.del{color:var(--red);border-color:#FECACA}
.act.del:hover{background:#FEF2F2;border-color:var(--red)}
.td-act{text-align:right;white-space:nowrap}

/* ── STATES ── */
.state{padding:56px 20px;text-align:center;color:var(--mid);font-size:13px}
.spinner{
  width:26px;height:26px;border:2.5px solid var(--border);border-top-color:var(--black);
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{
  background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;padding:14px 16px;
  font-size:13px;margin-bottom:18px;line-height:1.6;
}
.err-box b{display:block;margin-bottom:3px}
.warn-box{
  background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;padding:14px 16px;
  font-size:13px;line-height:1.65;
}
.warn-box b{display:block;margin-bottom:4px}
.warn-box a{color:#92400E}

/* ── SLIDE-IN PANEL ── */
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;visibility:hidden;
  transition:all .25s;z-index:90;
}
#overlay.on{opacity:1;visibility:visible}
#panel{
  position:fixed;top:0;right:0;height:100%;width:440px;max-width:100%;background:#fff;
  z-index:100;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:-8px 0 28px rgba(0,0,0,.13);
}
#panel.on{transform:translateX(0)}
.panel-head{
  padding:18px 22px;border-bottom:1px solid var(--border);display:flex;
  justify-content:space-between;align-items:center;flex:0 0 auto;
}
.panel-head h2{font-size:16px;font-weight:700}
.x-btn{color:var(--mid);font-size:21px;line-height:1;padding:4px}
.x-btn:hover{color:var(--dark)}
.panel-body{padding:22px;overflow-y:auto;flex:1}
.panel-foot{
  padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;flex:0 0 auto;background:#fff;
}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#52525B;margin-bottom:5px}
.fld .opt{color:#A1A1AA;font-weight:400;text-transform:none;letter-spacing:0}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);background:#fff;
  transition:border-color .15s;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--black)}
.fld textarea{min-height:96px;resize:vertical;line-height:1.55}
.fld .hint{font-size:11px;color:var(--mid);margin-top:4px}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--red)}
.fld .err{font-size:11px;color:var(--red);margin-top:4px;display:none}
.fld.bad .err{display:block}
.btn-plain{
  border:1px solid var(--border);padding:11px 18px;font-size:12px;font-weight:600;
  letter-spacing:1px;text-transform:uppercase;
}
.btn-plain:hover{border-color:#A1A1AA}
.img-row{display:flex;align-items:center;gap:12px}
.img-prev{
  width:66px;height:66px;border:1px solid var(--border);background:var(--off);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;
}
.img-prev img{max-width:100%;max-height:100%;object-fit:contain}
.img-prev span{font-size:23px;opacity:.4}
.file-btn{
  border:1px solid var(--border);padding:8px 13px;font-size:12px;
  display:inline-flex;align-items:center;gap:6px;
}
.file-btn:hover{border-color:#A1A1AA}
.rm-img{font-size:11px;color:var(--red);margin-top:6px;display:block}

/* ── DIALOG ── */
#dialog{
  position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:150;
  display:none;align-items:center;justify-content:center;padding:20px;
}
#dialog.on{display:flex}
.dlg{background:#fff;max-width:400px;width:100%;padding:24px}
.dlg h3{font-size:16px;margin-bottom:9px}
.dlg p{font-size:13px;color:#52525B;line-height:1.65;margin-bottom:20px}
.dlg .row{display:flex;gap:10px;justify-content:flex-end}
.btn-red{
  background:var(--red);color:#fff;padding:10px 17px;font-size:12px;
  font-weight:700;letter-spacing:1px;text-transform:uppercase;
}
.btn-red:hover{filter:brightness(1.08)}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(140%);
  background:var(--dark);color:#fff;padding:13px 20px;font-size:13px;z-index:180;
  transition:transform .3s;display:flex;align-items:center;gap:9px;max-width:92vw;
  box-shadow:0 8px 26px rgba(0,0,0,.22);
}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.ok{background:#14532D}
#toast.bad{background:#7F1D1D}

/* ── SETTINGS / MEDIA ── */
.card{border:1px solid var(--border);margin-bottom:16px}
.card h3{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mid);padding:13px 16px;border-bottom:1px solid var(--border);background:var(--off)}
.srow{display:flex;padding:12px 16px;border-bottom:1px solid #F4F4F5;font-size:13px;gap:14px;flex-wrap:wrap}
.srow:last-child{border-bottom:none}
.srow .k{width:150px;flex:0 0 auto;color:var(--mid)}
.srow .v{flex:1;min-width:180px;word-break:break-word}
.srow .v a{color:var(--blue);text-decoration:none}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.media-item{border:1px solid var(--border)}
.media-item .mi-img{height:120px;background:var(--off);display:flex;align-items:center;justify-content:center;overflow:hidden}
.media-item .mi-img img{max-width:100%;max-height:100%;object-fit:contain}
.media-item .mi-n{padding:8px 10px;font-size:11px;color:var(--mid);word-break:break-all;border-top:1px solid var(--border)}

/* ── RESPONSIVE ── */
@media(max-width:860px){
  .shell{flex-direction:column}
  nav.side{
    width:100%;flex:0 0 auto;flex-direction:row;overflow-x:auto;padding:0;
    border-right:none;border-bottom:1px solid var(--border);
  }
  .nav-item{width:auto;white-space:nowrap;padding:12px 15px}
  .nav-item.active{box-shadow:inset 0 -3px 0 #fff}
  .live-box{display:none}
  main{padding:20px 16px}
  .brand .adm,.brand .div{display:none}
  .huser .nm{display:none}
  table{min-width:520px}
  .col-cat,.col-photo{display:none}
  h1{font-size:19px}
}
@media(max-width:520px){
  .page-head{flex-direction:column;align-items:stretch}
  .btn-gold{justify-content:center}
  #panel{width:100%}
}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><span>SHAH</span> <span class="g">SPORTS</span></div>
    <div class="login-sub">Admin panel</div>
    <button class="login-btn" id="login-btn">Log in</button>
    <div class="login-note">
      Don't have an account?<br>
      Contact <a href="mailto:shahsports.poland@gmail.com">shahsports.poland@gmail.com</a> for access.
    </div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app" style="display:none">
  <header>
    <div class="brand">
      <div class="logo"><span class="w">SHAH</span> <span class="g">SPORTS</span></div>
      <span class="div">|</span><span class="adm">Admin</span>
    </div>
    <div class="huser">
      <span class="nm" id="u-name"></span>
      <div class="avatar" id="u-initials"></div>
      <button class="logout" id="logout-btn">Log out</button>
    </div>
  </header>

  <div class="shell">
    <nav class="side">
      <button class="nav-item active" data-view="products"><i class="ti ti-package"></i>Products</button>
      <button class="nav-item" data-view="media"><i class="ti ti-photo"></i>Media</button>
      <button class="nav-item" data-view="enquiries">
        <i class="ti ti-mail"></i>Enquiries<span class="nav-badge" id="enq-badge" style="display:none">0</span>
      </button>
      <button class="nav-item" data-view="settings"><i class="ti ti-settings"></i>Settings</button>
      <div class="live-box">
        <div class="t"><span class="dot"></span>Site is live</div>
        <a href="https://shahsports.pl" target="_blank" rel="noopener">shahsports.pl <i class="ti ti-external-link"></i></a>
      </div>
    </nav>

    <main id="main"></main>
  </div>
</div>

<!-- ══ SLIDE-IN PANEL ══ -->
<div id="overlay"></div>
<div id="panel">
  <div class="panel-head">
    <h2 id="panel-title">Add product</h2>
    <button class="x-btn" id="panel-x">&times;</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
  <div class="panel-foot">
    <button class="btn-gold" id="save-btn" style="flex:1;justify-content:center">Save product</button>
    <button class="btn-plain" id="cancel-btn">Cancel</button>
  </div>
</div>

<!-- ══ CONFIRM DIALOG ══ -->
<div id="dialog">
  <div class="dlg">
    <h3 id="dlg-title">Delete product</h3>
    <p id="dlg-msg"></p>
    <div class="row">
      <button class="btn-plain" id="dlg-cancel">Cancel</button>
      <button class="btn-red" id="dlg-ok">Delete</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   SHAH SPORTS ADMIN
   Auth: Netlify Identity · Storage: GitHub API via Git Gateway
   ═══════════════════════════════════════════════════════════ */

var REPO        = 'atarajput1990-maker/shahsports-website';
var BRANCH      = 'main';
var DATA_FILE   = 'products.json';
var MEDIA_DIR   = 'images/products';
var SITE_URL    = 'https://shahsports.pl';
var CONTACT     = 'shahsports.poland@gmail.com';
var WHATSAPP    = '+48 513 751 070';

/* Git Gateway exposes the GitHub API under /.netlify/git/github.
   Some setups expect the bare root, others the full /repos/{owner}/{repo}
   path, so we probe both once and cache whichever answers. */
var API_ROOTS = [
  '/.netlify/git/github/repos/' + REPO,
  '/.netlify/git/github'
];
var apiRoot = null;

/* Field options — these MUST stay in step with admin/config.yml */
var OPTS = {
  category:    ["Hockey stick","Bag","Glove","Shin guard","Face guard","Headgear","Ball","Grip","Coaching board","Boxing"],
  composition: ["","100% Glass","30-50% Carbon","70% Carbon","90% Carbon","100% Carbon","Cast PVC","Premium Chamois","Magnetic"],
  sizes:       ["","36.5 / 37.5 / 38.5 inch","36.5 / 37.5 inch","32.5 / 34.5 inch","S / M / L / XL","XS / S / M / L / XL","Adjustable","Universal"],
  colours:     ["","Red, Yellow, Gold, Green, Pink","Red, Yellow, Blue, Pink","White, Neon Yellow","Natural"],
  bow:         ["","Low bow","Mid bow","Standard bow"]
};

/* Filter pills -> which categories each one covers */
var PILLS = [
  {key:'all',         label:'All',         cats:null},
  {key:'sticks',      label:'Sticks',      cats:['Hockey stick']},
  {key:'bags',        label:'Bags',        cats:['Bag']},
  {key:'protection',  label:'Protection',  cats:['Shin guard','Face guard']},
  {key:'gloves',      label:'Gloves',      cats:['Glove']},
  {key:'headgear',    label:'Headgear',    cats:['Headgear']},
  {key:'accessories', label:'Accessories', cats:['Ball','Grip','Coaching board']}
];

var FIELD_ORDER = ['name','category','price','badge','composition','sizes',
                   'weight','dimensions','colours','bow','description','image'];

/* ── state ── */
var state = {
  products: [],
  sha: null,
  lastUpdated: null,
  view: 'products',
  pill: 'all',
  editIndex: -1,
  pendingFile: null,
  pendingRemoveImage: false,
  loading: false,
  saving: false,
  error: null
};

/* ═══ helpers ═══ */
function $(id){ return document.getElementById(id); }

function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* btoa/atob are Latin-1 only — go through UTF-8 bytes so that
   é, ·, — and friends survive the round trip. */
function b64encode(str){
  var bytes = new TextEncoder().encode(str), bin = '', CH = 0x8000;
  for(var i=0;i<bytes.length;i+=CH){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  }
  return btoa(bin);
}
function b64decode(b64){
  var bin = atob(String(b64).replace(/\s/g,''));
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function initials(name){
  var parts = String(name||'').trim().split(/[\s@._-]+/).filter(Boolean);
  if(!parts.length) return '?';
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

function fmtDate(iso){
  if(!iso) return 'unknown';
  var d = new Date(iso);
  if(isNaN(d)) return 'unknown';
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) +
         ' at ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

function slugify(s){
  return String(s||'product').toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50) || 'product';
}

function toast(msg, kind){
  var t = $('toast');
  t.className = kind || '';
  t.innerHTML = '<i class="ti ti-' + (kind === 'bad' ? 'alert-triangle' : 'circle-check') + '"></i>' + esc(msg);
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('on'); }, kind === 'bad' ? 7000 : 4500);
}

/* ═══ auth ═══ */
function currentUser(){
  return (window.netlifyIdentity && netlifyIdentity.currentUser()) || null;
}

/* jwt() refreshes an expired token; fall back to the raw one. */
function getToken(){
  var u = currentUser();
  if(!u) return Promise.reject(new Error('Not logged in'));
  if(typeof u.jwt === 'function'){
    return u.jwt().catch(function(){
      return (u.token && u.token.access_token) || Promise.reject(new Error('No access token'));
    });
  }
  return Promise.resolve((u.token && u.token.access_token) || '');
}

/* ═══ Git Gateway ═══ */
function gwFetch(path, opts){
  opts = opts || {};
  return getToken().then(function(tok){
    function attempt(rootIdx){
      var root = apiRoot !== null ? apiRoot : API_ROOTS[rootIdx];
      var headers = Object.assign({
        'Authorization': 'Bearer ' + tok,
        'Accept': 'application/json'
      }, opts.headers || {});
      if(opts.body) headers['Content-Type'] = 'application/json';

      return fetch(root + path, {
        method: opts.method || 'GET',
        headers: headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined
      }).then(function(res){
        /* an unknown root 404s on every path — try the next one */
        if(res.status === 404 && apiRoot === null && rootIdx < API_ROOTS.length - 1){
          return attempt(rootIdx + 1);
        }
        if(apiRoot === null && res.ok) apiRoot = API_ROOTS[rootIdx];
        return res;
      });
    }
    return attempt(0);
  });
}

function gwError(res, body){
  var msg = 'Request failed (' + res.status + ')';
  try{
    var j = typeof body === 'string' ? JSON.parse(body) : body;
    if(j && j.message) msg = j.message;
  }catch(e){}
  if(res.status === 401 || res.status === 403){
    msg = 'Not authorised. Your session may have expired, or Git Gateway is not enabled for this site.';
  }
  if(res.status === 404){
    msg = 'Could not reach the repository through Git Gateway. Check that Identity and Git Gateway are enabled in Netlify.';
  }
  if(res.status === 409){
    msg = 'The file changed since it was loaded. Reload the page and try again.';
  }
  return new Error(msg);
}

/* GET a file — returns {json, sha} (sha null when the file is absent) */
function readFile(path){
  return gwFetch('/contents/' + path + '?ref=' + BRANCH).then(function(res){
    if(res.status === 404) return {json:null, sha:null, missing:true};
    return res.text().then(function(txt){
      if(!res.ok) throw gwError(res, txt);
      var data = JSON.parse(txt);
      return {json: data, sha: data.sha, raw: data.content};
    });
  });
}

function writeFile(path, contentB64, sha, message){
  var body = {message: message, content: contentB64, branch: BRANCH};
  if(sha) body.sha = sha;
  return gwFetch('/contents/' + path, {method:'PUT', body:body}).then(function(res){
    return res.text().then(function(txt){
      if(!res.ok) throw gwError(res, txt);
      return JSON.parse(txt || '{}');
    });
  });
}

/* ═══ data ═══ */
function loadProducts(){
  state.loading = true; state.error = null;
  render();
  return readFile(DATA_FILE).then(function(r){
    if(r.missing){ state.products = []; state.sha = null; }
    else{
      var parsed = JSON.parse(b64decode(r.raw));
      state.products = (parsed && parsed.products) || [];
      state.sha = r.sha;
    }
    state.loading = false;
    render();
    loadLastCommit();
  }).catch(function(e){
    state.loading = false;
    state.error = e.message;
    render();
  });
}

function loadLastCommit(){
  gwFetch('/commits?path=' + DATA_FILE + '&sha=' + BRANCH + '&per_page=1')
    .then(function(res){ return res.ok ? res.json() : null; })
    .then(function(list){
      if(list && list[0] && list[0].commit && list[0].commit.committer){
        state.lastUpdated = list[0].commit.committer.date;
        if(state.view === 'products') render();
      }
    }).catch(function(){});
}

/* Build the record with keys in the same order as config.yml */
function normalise(p){
  var out = {};
  FIELD_ORDER.forEach(function(k){
    var v = p[k];
    if(k === 'price') out[k] = Number(v) || 0;
    else out[k] = v == null ? '' : String(v);
  });
  return out;
}

function saveProducts(message){
  var payload = {products: state.products.map(normalise)};
  var body = JSON.stringify(payload, null, 2) + '\n';
  /* re-read the sha immediately before writing so a stale one can't clobber */
  return readFile(DATA_FILE).then(function(r){
    return writeFile(DATA_FILE, b64encode(body), r.sha, message);
  }).then(function(res){
    if(res && res.content && res.content.sha) state.sha = res.content.sha;
    state.lastUpdated = new Date().toISOString();
    return res;
  });
}

function uploadImage(file, productName){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('Could not read the image file.')); };
    reader.onload = function(){
      var b64 = String(reader.result).split(',')[1];
      var ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g,'');
      var fname = slugify(productName) + '-' + Date.now() + '.' + ext;
      var path = MEDIA_DIR + '/' + fname;
      /* include the sha if something already sits at that path */
      readFile(path).then(function(existing){
        return writeFile(path, b64, existing.sha, 'Upload product image');
      }).then(function(){
        resolve('/' + path);
      }).catch(reject);
    };
    reader.readAsDataURL(file);
  });
}

/* Identity admin API — only works for a user with the "admin" role */
function loadUsers(){
  var box = $('users-list');
  if(!box) return;
  getToken().then(function(tok){
    return fetch('/.netlify/identity/admin/users', {headers:{Authorization:'Bearer ' + tok}});
  }).then(function(res){
    if(!res.ok) throw new Error(String(res.status));
    return res.json();
  }).then(function(data){
    var users = (data && data.users) || [];
    if(!users.length){ box.textContent = 'None'; return; }
    box.innerHTML = users.map(function(u){
      return esc((u.user_metadata && u.user_metadata.full_name) || u.email) +
             ' <span style="color:var(--mid)">&middot; ' + esc(u.email) + '</span>';
    }).join('<br>');
  }).catch(function(){
    box.innerHTML = '<span style="color:var(--mid)">Only visible to users with the ' +
      '<b>admin</b> role. Manage users in the Netlify dashboard under Identity.</span>';
  });
}

function closePanel(){
  $('overlay').classList.remove('on');
  $('panel').classList.remove('on');
  state.editIndex = -1;
  state.pendingFile = null;
}

function wirePanel(){
  var pick = $('pick-btn'), file = $('f-image');
  if(pick) pick.onclick = function(){ file.click(); };
  if(file) file.onchange = function(){
    var f = file.files && file.files[0];
    if(!f) return;
    if(f.size > 5 * 1024 * 1024){
      toast('That image is larger than 5 MB. Please use a smaller file.', 'bad');
      file.value = ''; return;
    }
    state.pendingFile = f;
    state.pendingRemoveImage = false;
    var rd = new FileReader();
    rd.onload = function(){ $('img-prev').innerHTML = '<img src="' + rd.result + '" alt=""/>'; };
    rd.readAsDataURL(f);
    $('img-hint').textContent = f.name + ' — uploads when you save';
  };
  var rm = $('rm-img');
  if(rm) rm.onclick = function(e){
    e.preventDefault();
    state.pendingRemoveImage = true;
    state.pendingFile = null;
    $('img-prev').innerHTML = '<span>&#127953;</span>';
    $('img-hint').textContent = 'Photo will be removed when you save';
    rm.style.display = 'none';
  };
}

function collectForm(){
  function val(id){ var e = $('f-' + id); return e ? e.value.trim() : ''; }
  var p = {
    name: val('name'),
    category: val('category'),
    price: val('price'),
    badge: val('badge'),
    composition: val('composition'),
    sizes: val('sizes'),
    weight: val('weight'),
    dimensions: val('dimensions'),
    colours: val('colours'),
    bow: val('bow'),
    description: val('description')
  };
  var ok = true;
  ['name','price','description'].forEach(function(k){
    var f = $('fld-' + k);
    if(f) f.classList.remove('bad');
  });
  if(!p.name){ $('fld-name').classList.add('bad'); ok = false; }
  if(p.price === '' || isNaN(Number(p.price)) || Number(p.price) < 0){
    $('fld-price').classList.add('bad'); ok = false;
  }
  if(!p.description){ $('fld-description').classList.add('bad'); ok = false; }
  if(!ok) return null;
  p.price = Number(p.price);
  return p;
}

function saveProduct(){
  if(state.saving) return;
  var data = collectForm();
  if(!data){ toast('Please fill in the highlighted fields.', 'bad'); return; }

  var idx = state.editIndex;
  var existing = idx >= 0 ? state.products[idx] : {};
  state.saving = true;
  var btn = $('save-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i>Saving&hellip;';

  /* 1. upload the image first (if one was picked) */
  var step = state.pendingFile
    ? uploadImage(state.pendingFile, data.name)
    : Promise.resolve(state.pendingRemoveImage ? '' : (existing.image || ''));

  step.then(function(imagePath){
    data.image = imagePath;
    /* 2. write the full products array back */
    if(idx >= 0) state.products[idx] = normalise(data);
    else state.products.push(normalise(data));
    return saveProducts('Update products via admin');
  }).then(function(){
    state.saving = false;
    btn.disabled = false;
    btn.innerHTML = 'Save product';
    closePanel();
    /* 3 + 4. confirm and refresh */
    toast('Saved — site will update in ~30 seconds', 'ok');
    render();
  }).catch(function(e){
    state.saving = false;
    btn.disabled = false;
    btn.innerHTML = 'Save product';
    /* roll the in-memory array back so the screen matches the repo */
    loadProducts();
    toast('Save failed: ' + e.message, 'bad');
  });
}

/* ═══ delete ═══ */
var pendingDelete = -1;
function askDelete(i){
  pendingDelete = i;
  var p = state.products[i];
  $('dlg-msg').textContent = 'Are you sure you want to delete ' + (p ? p.name : 'this product') +
                             '? This cannot be undone.';
  $('dialog').classList.add('on');
}
function doDelete(){
  var i = pendingDelete;
  if(i < 0) return;
  var removed = state.products[i];
  var backup = state.products.slice();
  state.products.splice(i, 1);
  $('dialog').classList.remove('on');
  pendingDelete = -1;
  render();
  saveProducts('Delete ' + removed.name + ' via admin').then(function(){
    toast('Deleted — site will update in ~30 seconds', 'ok');
    render();
  }).catch(function(e){
    state.products = backup;
    render();
    toast('Delete failed: ' + e.message, 'bad');
  });
}

/* ═══ wiring ═══ */
function wireMain(){
  var add = $('add-btn');
  if(add) add.onclick = function(){ openPanel(-1); };
  var retry = $('retry-btn');
  if(retry) retry.onclick = loadProducts;

  document.querySelectorAll('[data-pill]').forEach(function(b){
    b.onclick = function(){ state.pill = b.dataset.pill; render(); };
  });
  document.querySelectorAll('[data-edit]').forEach(function(b){
    b.onclick = function(){ openPanel(Number(b.dataset.edit)); };
  });
  document.querySelectorAll('[data-del]').forEach(function(b){
    b.onclick = function(){ askDelete(Number(b.dataset.del)); };
  });
  if(state.view === 'settings') loadUsers();
}

function showApp(user){
  $('login-screen').style.display = 'none';
  $('app').style.display = 'block';
  var nm = (user.user_metadata && user.user_metadata.full_name) || user.email || 'User';
  $('u-name').textContent = nm;
  $('u-initials').textContent = initials(nm);
  loadProducts();
  loadEnquiries();
}

function showLogin(){
  $('app').style.display = 'none';
  $('login-screen').style.display = 'flex';
}

document.addEventListener('DOMContentLoaded', function(){
  $('login-btn').onclick = function(){ netlifyIdentity.open('login'); };
  $('logout-btn').onclick = function(){ netlifyIdentity.logout(); };
  $('panel-x').onclick = closePanel;
  $('cancel-btn').onclick = closePanel;
  $('overlay').onclick = closePanel;
  $('save-btn').onclick = saveProduct;
  $('dlg-cancel').onclick = function(){ $('dialog').classList.remove('on'); pendingDelete = -1; };
  $('dlg-ok').onclick = doDelete;

  document.querySelectorAll('.nav-item').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('.nav-item').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      state.view = b.dataset.view;
      render();
    };
  });

  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if($('dialog').classList.contains('on')){ $('dialog').classList.remove('on'); pendingDelete = -1; }
    else if($('panel').classList.contains('on')) closePanel();
  });

  if(!window.netlifyIdentity){
    $('login-screen').innerHTML =
      '<div class="login-box"><div class="login-logo"><span>SHAH</span> <span class="g">SPORTS</span></div>' +
      '<div class="login-sub">Admin panel</div>' +
      '<div class="err-box"><b>Netlify Identity did not load</b>' +
      'Check your connection and reload. If this site is not deployed on Netlify, ' +
      'the admin panel cannot sign in.</div></div>';
    return;
  }

  netlifyIdentity.on('init', function(user){ user ? showApp(user) : showLogin(); });
  netlifyIdentity.on('login', function(user){ netlifyIdentity.close(); showApp(user); });
  netlifyIdentity.on('logout', function(){ showLogin(); });
  netlifyIdentity.on('error', function(err){
    toast('Login error: ' + (err && err.message ? err.message : 'unknown'), 'bad');
  });
  netlifyIdentity.init();
});
</script>
</body>
</html>
